<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="description" content="Daily: find mobile money cash points and withdraw faster." />
		<meta name="theme-color" content="#f6f5f2" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Daily" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- The first API call (session, points) skips DNS + TLS setup: seconds on a weak 3G connection. -->
		<link rel="preconnect" href="%sveltekit.env.PUBLIC_SUPABASE_URL%" crossorigin />
		<script src="%sveltekit.assets%/theme-init.js"></script>
		<!--
			Launch screen: painted on the first frame from this file alone (served by the service worker,
			no script needed), so opening Daily from the home screen never shows a blank page while the app
			starts. Same background as the manifest, so it follows Android's own splash without a flash.
			Removed by hideLaunchScreen() (src/lib/pwa/launch.ts) once the first screen has rendered.
		-->
		<style>
			#launch {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1rem;
				padding-bottom: env(safe-area-inset-bottom);
				background: #f6f5f2;
				color: #1a1a1a;
				font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
				transition:
					opacity 200ms ease-out,
					visibility 0s linear 200ms;
			}
			[data-theme='dark'] #launch {
				background: #121212;
				color: #f2f2f2;
			}
			#launch.launch-done {
				opacity: 0;
				visibility: hidden;
			}
			.launch-logo {
				width: 112px;
				height: 112px;
				border-radius: 26px;
				box-shadow: 0 14px 36px rgb(26 26 26 / 0.18);
			}
			.launch-name {
				margin: 0.25rem 0 0;
				font-size: 2.125rem;
				font-weight: 800;
				letter-spacing: -0.02em;
			}
			.launch-progress {
				position: relative;
				width: 3.5rem;
				height: 4px;
				margin-top: 0.5rem;
				overflow: hidden;
				border-radius: 2px;
				background: rgb(128 128 128 / 0.22);
			}
			.launch-progress::after {
				content: '';
				position: absolute;
				inset: 0;
				width: 40%;
				border-radius: inherit;
				background: #ffb020;
				animation: launch-progress 1.1s ease-in-out infinite;
			}
			@keyframes launch-progress {
				from {
					transform: translateX(-100%);
				}
				to {
					transform: translateX(250%);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#launch {
					transition: none;
				}
				.launch-progress::after {
					width: 100%;
					animation: none;
				}
			}
		</style>
		<title>Daily</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="launch" role="status" aria-label="Daily">
			<svg class="launch-logo" viewBox="0 0 512 512" aria-hidden="true">
				<rect width="512" height="512" rx="112" fill="#ffb020" />
				<path d="M160.74 256A110 110 0 1 1 351.26 256L256 421Z" fill="#1a1a1a" />
				<circle cx="256" cy="201" r="46" fill="#ffb020" />
			</svg>
			<p class="launch-name" aria-hidden="true">Daily</p>
			<span class="launch-progress" aria-hidden="true"></span>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
